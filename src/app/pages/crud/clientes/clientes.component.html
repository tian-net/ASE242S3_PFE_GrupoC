<div class="container">
  <H2>Gestion de Clientes</H2>

  <form #formCliente="ngForm" (ngSubmit)="guardar(formCliente)" novalidate>
  <div>
    <label>Nombre:</label>
    <input
      type="text"
      name="nombre"
      [(ngModel)]="clienteActual.nombre"
      required
      minlength="3"
      #nombre="ngModel"
      placeholder="Ingrese el nombre"
    />

    <!-- 🔹 Mensaje dinámico -->
    <div class="error"
      *ngIf="nombre.invalid && (nombre.dirty || nombre.touched)">
      <small *ngIf="nombre.errors?.['required']">⚠️ El nombre es obligatorio.</small>
      <small *ngIf="nombre.errors?.['minlength']">⚠️ Mínimo 3 caracteres.</small>
    </div>
  </div>

  <div>
    <label>Correo:</label>
    <input
      type="email"
      name="correo"
      [(ngModel)]="clienteActual.correo"
      required
      email
      #correo="ngModel"
      placeholder="Ingrese el correo"
    />

    <!-- 🔹 Mensaje dinámico -->
    <div class="error"
      *ngIf="correo.invalid && (correo.dirty || correo.touched)">
      <small *ngIf="correo.errors?.['required']">⚠️ El correo es obligatorio.</small>
      <small *ngIf="correo.errors?.['email']">⚠️ Ingrese un correo válido.</small>
    </div>
  </div>

  <button type="submit" [disabled]="formCliente.invalid">
    {{ editando ? 'Actualizar' : 'Guardar' }}
  </button>

  <button type="button" (click)="resetForm(formCliente)">
    Limpiar
  </button>
</form>

<hr />

<h3>Lista de Clientes</h3>
<ul>
  <li *ngFor="let c of clientes">
    {{ c.nombre }} - {{ c.correo }}
    <button (click)="editar(c)">Editar</button>
    <button (click)="eliminar(c.id)">Eliminar</button>
  </li>
</ul>

</div>
